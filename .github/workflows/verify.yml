name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Lightweight checks run in parallel via a matrix so one failure doesn't hide
  # the others (fail-fast: false). Each shows up as its own status check named
  # after the script (typecheck / lint / test / build).
  checks:
    name: ${{ matrix.script }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        script: [typecheck, lint, test, build]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm ${{ matrix.script }}

  # E2E runs separately because it needs a real browser. GitHub Actions has no
  # pre-provisioned Chromium (unlike Claude Code on the web), so install it here.
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      # On failure, upload Playwright traces/screenshots (test-results/) for debugging.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
