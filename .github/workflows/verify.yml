name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Lightweight checks run in parallel via a matrix so one failure doesn't hide
  # the others (fail-fast: false). Each shows up as its own status check named
  # after the script (typecheck / lint / test / build).
  checks:
    name: ${{ matrix.script }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        script: [typecheck, lint, test, build]
    steps:
      - uses: actions/checkout@v4
        with:
          # The test leg reads git history (the legacy-ref map against the kit move, reaudit in a
          # full-history clone); the other legs need only the tip.
          fetch-depth: ${{ matrix.script == 'test' && '0' || '1' }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm ${{ matrix.script }}

  # Provenance (warn-only): TRACE records cite the commit they were written on. A squash merge
  # orphans those commits, so `reaudit --unreachable` warns about every record whose provenance
  # the full history no longer has (merge with a merge commit instead). It never fails the run.
  # The records live on the loop-state branch (the project's workspace), checked out beside the
  # project as the workspace; with no such branch there is nothing to audit.
  provenance:
    name: provenance
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check out the loop state (claude/loop-state) as the workspace
        id: state
        run: |
          if git fetch --quiet origin claude/loop-state; then
            git worktree add --quiet --detach "$RUNNER_TEMP/loop-state" FETCH_HEAD
            echo "dir=$RUNNER_TEMP/loop-state" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=TRACE provenance::no claude/loop-state branch — nothing to audit"
          fi
      - if: steps.state.outputs.dir
        env:
          LOOP_SETUP_WORKSPACE: ${{ steps.state.outputs.dir }}
        run: node kit/trace/cli.mjs reaudit --unreachable --annotate

  # E2E runs separately because it needs a real browser. GitHub Actions has no
  # pre-provisioned Chromium (unlike Claude Code on the web), so install it here.
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      # On failure, upload Playwright traces/screenshots (test-results/) for debugging.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
